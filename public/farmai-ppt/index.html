<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmAI Presentation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .presentation-container {
      position: relative;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
    }
    .presentation-image {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Fixed Dashboard Button that stays on screen */
    .fixed-dashboard-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 100;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      padding: 16px 32px;
      border-radius: 99px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .fixed-dashboard-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(34, 197, 94, 0.5);
    }
    /* Invisible overlay link over the buttons in the image */
    .invisible-link {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      border-radius: 8px;
      transition: background 0.2s;
    }
    /* Show a subtle highlight when hovering over the clickable area so you know it works */
    .invisible-link:hover {
      background: rgba(34, 197, 94, 0.2);
    }
  </style>
</head>
<body>
  <div class="presentation-container">
    <img src="farmi_landing_fixed.png" alt="FarmAI Presentation" class="presentation-image" />
    
    <!-- Link for the 'View Dashboard' button in the hero section (approximate position) -->
    <a href="/farmai-dashboard/index.html" class="invisible-link" title="Hero Dashboard Button" style="top: 15%; left: 35%; width: 30%; height: 5%;"></a>

    <!-- Link for the 'Get Started Today' button in the lower section (approximate position) -->
    <a href="/farmai-dashboard/index.html" class="invisible-link" title="Get Started / View Dashboard" style="top: 86.5%; left: 35%; width: 30%; height: 5%;"></a>
  </div>

  <a href="/farmai-dashboard/index.html" class="fixed-dashboard-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Open Dashboard
  </a>
</body>
</html>
